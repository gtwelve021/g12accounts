<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>G12 Accounts form endpoint</title></head>
  <body>
    <form name="g12-enquiry" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="g12-enquiry">
      <input name="first-name" type="text">
      <input name="last-name" type="text">
      <input name="email" type="email">
      <input name="phone" type="tel">
      <input name="service" type="text">
      <textarea name="message"></textarea>
      <input name="privacy-consent" type="checkbox">
    </form>
  </body>
</html>
